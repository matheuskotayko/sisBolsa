spring.application.name=cadastroBolsistas

# conexao com o banco. os valores podem vir do ambiente, o que ja deixa
# pronto para o container da etapa 7 apontar para o servico "db"
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:cadastroBolsista}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# o flyway e dono do schema, o hibernate nao encosta na estrutura das tabelas
spring.jpa.hibernate.ddl-auto=none
# sem sessao aberta na view: as relacoes que as jsp usam sao todas eager
spring.jpa.open-in-view=false

# jwt: em producao o segredo tem que vir do ambiente, nunca do arquivo
app.jwt.secret=${JWT_SECRET:troque-esse-segredo-em-producao-precisa-ter-pelo-menos-32-bytes}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# nao vaza stacktrace pro cliente na pagina de erro padrao do spring
# (o ApiExceptionHandler ja cobre /api/**, isso e so pro resto)
server.error.include-stacktrace=never
